<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5ef">
  <title>Daymark — a little less to remember</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f5ef;
      --surface: #fffefa;
      --ink: #202b25;
      --muted: #778078;
      --line: #e4e8df;
      --green: #3d7658;
      --green-dark: #2d5b43;
      --coral: #d95f46;
      --yellow: #f2c75c;
      --shadow: 0 20px 60px rgb(43 57 46 / 9%);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 52px 20px 72px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#cdd6c9 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 620px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgb(32 43 37 / 7%);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      animation: arrive 420ms ease-out both;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 34px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: var(--green);
      font-size: 15px;
    }

    .today {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .content { padding: 38px 34px 30px; }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 8vw, 44px);
      font-weight: 500;
      line-height: 1.12;
    }

    .subtitle {
      margin: 10px 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .add-form {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    .add-form input {
      min-width: 0;
      flex: 1;
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: none;
      background: #fff;
      font-size: 14px;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    .add-form input::placeholder { color: #9aa199; }

    .add-form input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgb(61 118 88 / 12%);
    }

    .add-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 112px;
      padding: 0 17px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: var(--green);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: background 140ms ease, transform 140ms ease;
    }

    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: translateY(1px); }
    .add-button:focus-visible, .filter:focus-visible, .clear-button:focus-visible, .delete-button:focus-visible {
      outline: 3px solid rgb(61 118 88 / 30%);
      outline-offset: 2px;
    }

    .add-button span { font-size: 19px; font-weight: 400; line-height: 1; }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      border-bottom: 1px solid var(--line);
    }

    .filters { display: flex; align-items: center; gap: 4px; }

    .filter {
      position: relative;
      padding: 10px 9px 11px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }

    .filter[aria-pressed="true"] { color: var(--ink); }
    .filter[aria-pressed="true"]::after {
      position: absolute;
      right: 9px;
      bottom: -1px;
      left: 9px;
      height: 2px;
      background: var(--coral);
      content: "";
    }

    .task-count { color: var(--muted); font-size: 11px; }

    .task-list { margin: 0; padding: 0; list-style: none; }

    .task-item {
      display: flex;
      min-height: 61px;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid var(--line);
      animation: arrive 220ms ease-out both;
    }

    .task-toggle {
      display: grid;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      place-items: center;
      padding: 0;
      border: 1.5px solid #bbc4b9;
      border-radius: 50%;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .task-toggle:hover { border-color: var(--green); }
    .task-item[data-completed="true"] .task-toggle {
      border-color: var(--green);
      background: var(--green);
    }

    .task-toggle svg { width: 12px; height: 12px; }

    .task-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.45;
    }

    .task-item[data-completed="true"] .task-text {
      color: #9ba39b;
      text-decoration: line-through;
      text-decoration-color: #b5bdb4;
    }

    .delete-button {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #9aa199;
      cursor: pointer;
      opacity: 0;
      transition: color 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    .task-item:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { color: var(--coral); background: #fff1ed; }
    .delete-button svg { width: 16px; height: 16px; }

    .empty-state {
      display: grid;
      min-height: 170px;
      place-content: center;
      justify-items: center;
      gap: 8px;
      color: var(--muted);
      text-align: center;
    }

    .empty-icon {
      display: grid;
      width: 38px;
      height: 38px;
      margin-bottom: 3px;
      place-items: center;
      border-radius: 12px;
      background: #f8f0d8;
      color: #9a7627;
      font-size: 18px;
    }

    .empty-state strong { color: var(--ink); font-size: 13px; }
    .empty-state span { font-size: 12px; }

    .list-footer {
      display: flex;
      min-height: 49px;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
    }

    .clear-button {
      padding: 7px 0 7px 10px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }

    .clear-button:hover:not(:disabled) { color: var(--coral); }
    .clear-button:disabled { cursor: default; opacity: 0.45; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      body { padding: 20px 12px 36px; }
      .topline { padding: 19px 20px; }
      .content { padding: 31px 20px 20px; }
      .add-button { min-width: 48px; padding: 0 13px; }
      .add-button .button-label { display: none; }
      .add-button span { font-size: 22px; }
      .delete-button { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> Daymark</div>
      <time class="today" id="today"></time>
    </header>
    <section class="content" aria-labelledby="page-title">
      <p class="eyebrow">A little less to remember</p>
      <h1 id="page-title">Make room<br>for what matters.</h1>
      <p class="subtitle">One thing at a time. You've got this.</p>

      <form class="add-form" id="add-form">
        <label for="task-input" class="visually-hidden">Add a task</label>
        <input id="task-input" name="task" type="text" maxlength="200" placeholder="What needs doing?" autocomplete="off" required>
        <button class="add-button" type="submit"><span aria-hidden="true">+</span><span class="button-label">Add task</span></button>
      </form>

      <section aria-label="Your tasks">
        <div class="list-heading">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter" type="button" data-filter="completed" aria-pressed="false">Done</button>
          </div>
          <span class="task-count" id="task-count" aria-live="polite"></span>
        </div>
        <ul class="task-list" id="task-list" aria-live="polite"></ul>
        <div class="list-footer">
          <span id="footer-count"></span>
          <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
        </div>
      </section>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "daymark-tasks";
    const taskList = document.querySelector("#task-list");
    const taskInput = document.querySelector("#task-input");
    const taskCount = document.querySelector("#task-count");
    const footerCount = document.querySelector("#footer-count");
    const clearCompletedButton = document.querySelector("#clear-completed");
    const filters = document.querySelectorAll(".filter");
    let currentFilter = "all";
    let tasks = loadTasks();

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved)
          ? saved.filter(task => task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean")
          : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function makeTaskElement(task) {
      const item = document.createElement("li");
      item.className = "task-item";
      item.dataset.completed = String(task.completed);

      const toggle = document.createElement("button");
      toggle.className = "task-toggle";
      toggle.type = "button";
      toggle.setAttribute("aria-label", `${task.completed ? "Mark as active" : "Complete"}: ${task.text}`);
      if (task.completed) {
        toggle.innerHTML = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8 3 3 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      }
      toggle.addEventListener("click", () => {
        task.completed = !task.completed;
        saveTasks();
        render();
      });

      const text = document.createElement("span");
      text.className = "task-text";
      text.textContent = task.text;

      const remove = document.createElement("button");
      remove.className = "delete-button";
      remove.type = "button";
      remove.setAttribute("aria-label", `Delete: ${task.text}`);
      remove.innerHTML = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2m-6 0 1 10h6l1-10m-5 3v4m2-4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      remove.addEventListener("click", () => {
        tasks = tasks.filter(item => item.id !== task.id);
        saveTasks();
        render();
      });

      item.append(toggle, text, remove);
      return item;
    }

    function render() {
      const visibleTasks = tasks.filter(task => {
        if (currentFilter === "active") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
      });
      const remaining = tasks.filter(task => !task.completed).length;
      taskCount.textContent = `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}`;
      footerCount.textContent = `${remaining} ${remaining === 1 ? "item" : "items"} left`;
      clearCompletedButton.disabled = !tasks.some(task => task.completed);
      taskList.replaceChildren();

      if (visibleTasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        const message = currentFilter === "active" && tasks.length > 0
          ? ["All caught up", "Nothing left on your active list."]
          : currentFilter === "completed" && tasks.length > 0
            ? ["Nothing checked off yet", "Finished tasks will show up here."]
            : ["A fresh start", "Add a task above and take it from there."];
        empty.innerHTML = '<span class="empty-icon" aria-hidden="true">✳</span>';
        const title = document.createElement("strong");
        title.textContent = message[0];
        const detail = document.createElement("span");
        detail.textContent = message[1];
        empty.append(title, detail);
        taskList.append(empty);
        return;
      }

      taskList.append(...visibleTasks.map(makeTaskElement));
    }

    document.querySelector("#add-form").addEventListener("submit", event => {
      event.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.unshift({ id: crypto.randomUUID(), text, completed: false });
      saveTasks();
      currentFilter = "all";
      filters.forEach(filter => filter.setAttribute("aria-pressed", String(filter.dataset.filter === currentFilter)));
      taskInput.value = "";
      render();
      taskInput.focus();
    });

    filters.forEach(filter => filter.addEventListener("click", () => {
      currentFilter = filter.dataset.filter;
      filters.forEach(button => button.setAttribute("aria-pressed", String(button === filter)));
      render();
    }));

    clearCompletedButton.addEventListener("click", () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      render();
    });

    document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "short", month: "short", day: "numeric"
    }).format(new Date());
    render();
  </script>
</body>
</html>
